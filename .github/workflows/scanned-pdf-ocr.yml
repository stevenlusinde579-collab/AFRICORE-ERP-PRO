name: Scanned PDF OCR validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/scanned-pdf-ocr.yml"
  push:
    branches: ["feature/scanned-pdf-ocr"]
    paths:
      - "backend/**"
      - ".github/workflows/scanned-pdf-ocr.yml"

permissions:
  contents: write

jobs:
  backend-ocr-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate and commit synchronized dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync backend OCR dependency lockfile"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run OCR regression tests
        run: npm run test:pdf-ocr
      - name: Run complete backend AI safety tests
        run: npm run test:ai-safe
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-lock
          path: backend/package-lock.json
          if-no-files-found: error
