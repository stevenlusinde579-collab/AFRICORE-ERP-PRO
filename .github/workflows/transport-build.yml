name: Transport Management Build Checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "supabase/migrations/**"
      - ".github/workflows/transport-build.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  transport-build:
    name: Transport API and Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Check Transport backend syntax
        run: |
          node --check backend/controllers/transportController.js
          node --check backend/routes/transportRoutes.js
          node --check backend/server.js
