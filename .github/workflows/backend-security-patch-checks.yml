name: Backend security patch checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/school-scoped-storage]

jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check modified backend JavaScript syntax
        working-directory: backend
        run: |
          node --check middleware/schoolContextMiddleware.js
          node --check controllers/examController.js
          node --check controllers/approvalController.js
          node --check controllers/ai.controller.js
          node --check controllers/resultAnalysiscontroller.js
          node --check routes/examRoutes.js
          node --check routes/ai.routes.js
          node --check routes/resultAnalysisRoutes.js
          node --check routes/financeRoutes.js
          node --check routes/communicationRoutes.js
