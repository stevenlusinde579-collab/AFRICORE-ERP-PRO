name: NECTA PReMS Import Checks

on:
  push:
    branches:
      - feature/necta-prems-qualified-profile-import
    paths:
      - "frontend/src/pages/students/NectaStudentImport.jsx"
      - "frontend/src/utils/nectaPremsTextParser.js"
      - "frontend/tests/nectaPremsTextParser.test.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "supabase/migrations/*necta*"
      - ".github/workflows/necta-prems-import-checks.yml"
  pull_request:
    paths:
      - "frontend/src/pages/students/NectaStudentImport.jsx"
      - "frontend/src/utils/nectaPremsTextParser.js"
      - "frontend/tests/nectaPremsTextParser.test.js"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "supabase/migrations/*necta*"

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run PReMS parser tests
        run: npm run test:necta-prems
      - name: Build frontend
        run: npm run build
