name: Advanced Combinations Frontend Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/advanced-combinations-build.yml'
  push:
    branches: [feat/advanced-combinations]
    paths:
      - 'frontend/**'
      - '.github/workflows/advanced-combinations-build.yml'

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run result grading tests
        run: npm run test:result-grading
      - name: Build frontend
        run: npm run build
