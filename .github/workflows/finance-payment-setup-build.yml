name: Finance Payment Setup Build

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "supabase/migrations/**"
      - ".github/workflows/finance-payment-setup-build.yml"
  push:
    branches: [fix/finance-payment-setup-accumulation]
    paths:
      - "frontend/**"
      - "supabase/migrations/**"
      - ".github/workflows/finance-payment-setup-build.yml"

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
